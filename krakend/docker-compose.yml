services:
  catalog-proxy:
    image: devopsfaith/krakend:2.9
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      FC_ENABLE: "1"
    container_name: catalog-proxy
    volumes:
      - ./krakend.json:/etc/krakend/krakend.json:ro
    command: ["run", "-c", "/etc/krakend/krakend.json"]
    restart: unless-stopped

  # Optional local Jellyfin server for development. Only starts with:
  #   docker compose --profile local-jellyfin up
  # Set JELLYFIN_BASE_URL=http://jellyfin:8096 in .env when using it.
  jellyfin:
    image: jellyfin/jellyfin:10.10.7
    profiles: ["local-jellyfin"]
    container_name: jellyfin
    ports:
      - "8096:8096"
    volumes:
      - ./jellyfin/config:/config
      - ./jellyfin/cache:/cache
      - ./jellyfin/media:/media
    restart: unless-stopped
